<h1>Page Not Found</h1>
<p>Redirecting to the blog location if this was an old blog URL...</p>

<script>
  (function () {
    var path = window.location.pathname || "/";
    var lower = path.toLowerCase();

    if (path === "/" || lower.indexOf("/blog/") === 0) {
      return;
    }

    // Do not redirect likely static asset requests.
    if (/\.[a-z0-9]{1,8}$/i.test(path)) {
      return;
    }

    var target = "/blog" + (path.charAt(0) === "/" ? path : "/" + path);
    target += window.location.search || "";
    target += window.location.hash || "";

    window.location.replace(target);
  })();
</script>
